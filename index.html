<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mitschrift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: workspace app. Library sidebar on the left (drawer on phones), a document column on the right;
   the recorder is a sticky bar on desktop and a bottom dock on phones. Red is reserved for recording. */
:root {
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f0f0ed; --line: #e4e3df; --line-2: #d6d5d0;
  --ink: #17181b; --muted: #676a72; --faint: #a1a3a9; --on-ink: #ffffff;
  --rec: #e5484d; --rec-soft: rgba(229, 72, 77, .14);
  --hl: #fbe7bd; --hl-line: #e9a23b; --hl-ink: #17181b;
  --note: #eaf0fd; --note-line: #3a6fe0; --note-ink: #23417f;
  --ok: #2d8a5f; --warn: #b4581c;
  --shadow: 0 1px 2px rgba(20, 22, 28, .05), 0 8px 24px -12px rgba(20, 22, 28, .18);
  --f-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, Menlo, Consolas, monospace;
  --side: 272px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e0f11; --surface: #15161a; --surface-2: #1c1e22; --line: #26282d; --line-2: #33363c;
  --ink: #ececee; --muted: #9b9ea6; --faint: #5f626a; --on-ink: #0e0f11;
  --rec: #ff6166; --rec-soft: rgba(255, 97, 102, .16);
  --hl: rgba(233, 162, 59, .24); --hl-line: #e9a23b; --hl-ink: #f6efe2;
  --note: rgba(90, 140, 255, .12); --note-line: #6f9bff; --note-ink: #b9cdff;
  --ok: #5cc596; --warn: #f0a46b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px -14px rgba(0, 0, 0, .6);
  color-scheme: dark } }

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0; height: 100% }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--note-line); outline-offset: 2px; border-radius: 6px }
svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.label { font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; font: 500 13.5px/1.2 var(--f-sans); white-space: nowrap }
.btn:hover { background: var(--surface-2) }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink) }
.btn.primary:hover { opacity: .9 }
.btn.ghost { border-color: transparent; background: transparent }
.btn.ghost:hover { background: var(--surface-2) }
.btn.danger { color: var(--rec) }
.btn:disabled { opacity: .45; cursor: default }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 0; background: transparent; color: var(--muted) }
.icon-btn:hover { background: var(--surface-2); color: var(--ink) }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line) }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 10px; border-radius: 6px; font: 500 12.5px/1.2 var(--f-sans) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08) }
select.btn { padding-right: 8px }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100% }
.sidebar { border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
  padding: max(16px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)) }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 16px; font: 600 16px/1 var(--f-sans); letter-spacing: -.01em }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); display: grid; place-items: center }
.logo i { width: 9px; height: 9px; border-radius: 50%; background: var(--rec) }
.side-new { width: 100%; justify-content: center; margin-bottom: 14px }
.side-label { padding: 0 8px 8px }
.lib { flex: 1; overflow-y: auto; display: grid; align-content: start; gap: 2px; margin: 0 -4px; padding: 0 4px }
.lib-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-radius: 8px }
.lib-item:hover, .lib-item.cur { background: var(--surface-2) }
.lib-item .open { all: unset; cursor: pointer; padding: 8px 4px 8px 10px; min-width: 0; display: grid; gap: 1px }
.lib-item .open:focus-visible { outline: 2px solid var(--note-line); border-radius: 8px }
.lib-item b { font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lib-item small { color: var(--muted); font-size: 12px }
.lib-item .del { opacity: 0; margin-right: 4px }
.lib-item:hover .del, .lib-item .del:focus-visible { opacity: 1 }
.lib-item .confirm { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 10px 10px; font-size: 13px; color: var(--muted) }
.lib-item .confirm span { flex-basis: 100% }
.side-foot { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; display: grid; gap: 2px }
.side-foot .btn { justify-content: flex-start; width: 100% }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); margin-left: auto }
.status-dot.on { background: var(--ok) }

.topbar { display: none }
.backdrop { display: none }

main { min-width: 0; padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)) }
.page { max-width: 820px; margin: 0 auto; padding-block: 28px 64px }

/* lecture header */
.head { display: grid; gap: 6px; margin-bottom: 18px }
#title { width: 100%; border: 0; background: transparent; padding: 2px 0; font: 650 28px/1.2 var(--f-sans); letter-spacing: -.025em; border-radius: 6px }
#title:focus { outline: none; box-shadow: 0 2px 0 var(--line-2) }
.meta { color: var(--muted); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 14px }

/* recorder */
.recorder { position: sticky; top: max(12px, env(safe-area-inset-top)); z-index: 10; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow) }
.recbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--rec); display: grid; place-items: center; flex: none; transition: transform .12s }
.recbtn:active { transform: scale(.94) }
.recbtn i { width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: border-radius .2s }
.on .recbtn i { border-radius: 3px }
.on .recbtn { box-shadow: 0 0 0 5px var(--rec-soft) }
.rec-time { display: grid; gap: 1px; min-width: 74px }
.rec-time .mono { font-size: 19px; font-weight: 500; letter-spacing: -.02em }
.rec-state { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px }
.on .rec-state { color: var(--rec) }
.on .rec-state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rec); animation: blink 1.2s infinite }
@keyframes blink { 50% { opacity: .25 } }
.wave { display: flex; align-items: center; gap: 2px; height: 28px; flex: 1; min-width: 60px; overflow: hidden; justify-content: center }
.wave span { width: 2px; height: 2px; border-radius: 2px; background: var(--line-2); transition: height .12s; flex: none }
.on .wave span { background: var(--rec) }
.rec-right { display: flex; align-items: center; gap: 8px; margin-left: auto }

/* tabs */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); margin: 22px 0 22px }
.tabs button { border: 0; background: none; padding: 10px 0; margin-bottom: -1px; border-bottom: 2px solid transparent; color: var(--muted); font: 500 14px var(--f-sans); display: inline-flex; gap: 6px; align-items: center }
.tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink) }
.tabs .n { font: 12px var(--f-mono); color: var(--faint) }

/* transcript document */
.doc { font-size: 17px; line-height: 1.75; max-width: 68ch }
.doc p { margin: 0 0 1em }
.ln { border-radius: 4px; padding: 1px 0; cursor: text; transition: background .15s }
.ln:hover { background: var(--surface-2) }
.ln.hl { background: var(--hl); color: var(--hl-ink); box-shadow: inset 0 -2px 0 var(--hl-line); padding: 1px 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone }
.ln.editing { background: var(--surface); outline: 2px solid var(--note-line); outline-offset: 1px; padding: 1px 3px; cursor: text }
.note { margin: 0 0 1em; padding: 10px 14px; border-radius: 10px; background: var(--note); color: var(--note-ink); border-left: 3px solid var(--note-line); font-size: 15.5px; line-height: 1.6 }
.note .label { color: var(--note-line); display: block; margin-bottom: 4px }
.note .ln:hover { background: transparent }
#interim { color: var(--faint); font-size: 17px; line-height: 1.75; min-height: 1.75em; max-width: 68ch }
.empty { border: 1px dashed var(--line-2); border-radius: 14px; padding: 36px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center }
.empty b { color: var(--ink); font-weight: 600; font-size: 16px }
.addnote { display: flex; gap: 8px; margin-top: 18px; padding: 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
.addnote input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 8px; outline: none }
.hint { color: var(--faint); font-size: 12.5px; margin-top: 14px }

/* notes view */
.notes { display: grid; gap: 18px }
.notes-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px }
.card h3 { margin: 0; font: 600 15px/1.3 var(--f-sans); display: flex; align-items: center; gap: 8px }
.card h3 .n { font: 12px var(--f-mono); color: var(--faint); font-weight: 400 }
.card ul { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 6px }
.card .none { color: var(--faint); font-size: 14px; margin: 10px 0 0 }
.card.hl li::marker { color: var(--hl-line) }
.card.todo li::marker { color: var(--rec) }
.card.own li { color: var(--note-ink) }
.ai { padding: 0; overflow: hidden }
.ai-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line) }
.ai-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px }
.spark { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink) }
.ai-body { padding: 18px 20px; min-height: 80px }
.ai-body.placeholder { color: var(--muted); font-size: 14px }
.ai-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 10px 14px 12px 20px; border-top: 1px solid var(--line); background: var(--surface-2) }
.ai-foot .status { font-size: 12.5px; color: var(--muted); margin-right: auto }
.ai-foot .status.err { color: var(--rec) }
.thinking { display: inline-flex; gap: 8px; align-items: center; color: var(--muted) }
.thinking i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--ink); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
.md { font-size: 15px; line-height: 1.65 }
.md h2, .md h3, .md h4 { font: 600 16px/1.35 var(--f-sans); margin: 1.2em 0 .4em; letter-spacing: -.01em }
.md > :first-child { margin-top: 0 }
.md p { margin: 0 0 .7em }
.md ul, .md ol { margin: 0 0 .8em; padding-left: 20px }
.md li { margin: 0 0 .25em }
.md code { font: 13px var(--f-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px }
.md strong { font-weight: 600 }
textarea.edit-md { width: 100%; min-height: 320px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); padding: 12px; font: 13.5px/1.6 var(--f-mono); resize: vertical }

/* settings dialog */
dialog { border: 1px solid var(--line); border-radius: 16px; padding: 0; width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 40px); background: var(--surface); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(0,0,0,.45) }
dialog::backdrop { background: rgba(10, 12, 16, .45); backdrop-filter: blur(2px) }
.dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 1 }
.dlg-head h2 { margin: 0; font: 600 17px var(--f-sans) }
.dlg-body { padding: 6px 18px 18px; display: grid }
.set { display: grid; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line) }
.set:last-child { border-bottom: 0 }
.set .seg { justify-self: start }
.set h3 { margin: 0; font: 600 14.5px var(--f-sans); display: flex; align-items: center; gap: 8px }
.set p { margin: 0; color: var(--muted); font-size: 13.5px }
.set a { color: var(--note-line) }
.field { display: flex; gap: 8px; flex-wrap: wrap }
.field input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); padding: 8px 10px; font: 13.5px var(--f-mono) }
.set textarea { width: 100%; min-height: 150px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--bg); padding: 10px; font: 13.5px/1.6 var(--f-mono); resize: vertical }
.pill { font: 500 11.5px/1 var(--f-sans); padding: 4px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted) }
.pill.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent) }
.pill.err { color: var(--rec); background: var(--rec-soft) }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px }
.check input { margin-top: 3px; accent-color: var(--ink) }
.learned { font-size: 13px; color: var(--muted) }

.toast { position: fixed; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateY(16px); opacity: 0; pointer-events: none; z-index: 60;
  background: var(--ink); color: var(--on-ink); padding: 10px 12px 10px 16px; border-radius: 10px; font-size: 13.5px; line-height: 1.4; max-width: min(calc(100vw - 32px), 560px);
  display: flex; gap: 12px; align-items: center; transition: .2s; box-shadow: var(--shadow) }
.toast.show { opacity: 1; transform: none; pointer-events: auto }
.toast.err { background: var(--rec); color: #fff }
.toast button { border: 0; background: rgba(255,255,255,.16); color: inherit; border-radius: 6px; padding: 5px 9px; font: 600 12.5px var(--f-sans) }
.toast button[hidden] { display: none }

/* ---------- phones ---------- */
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr) }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); z-index: 50; transform: translateX(-105%); transition: transform .22s; box-shadow: var(--shadow) }
  .sidebar.open { transform: none }
  .backdrop { display: block; position: fixed; inset: 0; z-index: 45; background: rgba(10,12,16,.4); opacity: 0; pointer-events: none; transition: opacity .2s }
  .backdrop.show { opacity: 1; pointer-events: auto }
  .topbar { display: flex; align-items: center; gap: 6px; position: sticky; top: 0; z-index: 20; background: var(--bg);
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) 8px max(8px, env(safe-area-inset-left)); border-bottom: 1px solid var(--line) }
  .topbar .brand { padding: 0; flex: 1; justify-content: center; font-size: 15px }
  .page { padding-block: 18px calc(120px + env(safe-area-inset-bottom)) }
  #title { font-size: 23px }
  .recorder { position: fixed; top: auto; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30; gap: 10px; flex-wrap: nowrap }
  .wave { display: none }
  .rec-right { gap: 6px }
  .rec-right .btn span { display: none }
  .lib-item .del { opacity: 1 }
  .doc, #interim { font-size: 16.5px }
  .toast { bottom: calc(92px + env(safe-area-inset-bottom)) }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-mark" viewBox="0 0 24 24"><path d="m9 11 6-6 4 4-6 6M9 11l-5 5v4h4l5-5M9 11l4 4"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar" aria-label="Library">
    <div class="brand"><span class="logo"><i></i></span>Mitschrift</div>
    <button class="btn primary side-new" id="newBtn" type="button"><svg><use href="#i-plus"/></svg><span data-t="new"></span></button>
    <div class="label side-label" data-t="library"></div>
    <div class="lib" id="lib"></div>
    <div class="side-foot">
      <button class="btn ghost" type="button" data-open-settings><svg><use href="#i-gear"/></svg><span data-t="settings"></span><span class="status-dot" id="keyDot"></span></button>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <main>
    <div class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>
      <div class="brand"><span class="logo"><i></i></span>Mitschrift</div>
      <button class="icon-btn" type="button" data-open-settings aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
    </div>

    <div class="page">
      <header class="head">
        <input id="title" type="text" aria-label="Title" autocomplete="off">
        <div class="meta" id="meta"></div>
      </header>

      <section class="recorder" id="recorder">
        <button class="recbtn" id="recBtn" type="button"><i></i></button>
        <div class="rec-time"><span class="mono" id="timer">00:00</span><span class="rec-state" id="state"></span></div>
        <div class="wave" id="wave" aria-hidden="true"></div>
        <div class="rec-right">
          <div class="seg" role="group" aria-label="Spoken language">
            <button type="button" data-lang="de-DE" aria-pressed="false">DE</button>
            <button type="button" data-lang="en-US" aria-pressed="true">EN</button>
          </div>
          <button class="btn" id="markBtn" type="button"><svg><use href="#i-mark"/></svg><span data-t="mark"></span></button>
        </div>
      </section>

      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="doc" aria-selected="true"><span data-t="tabDoc"></span><span class="n" id="cWords"></span></button>
        <button role="tab" data-tab="notes" aria-selected="false"><span data-t="tabNotes"></span><span class="n" id="cMarks"></span></button>
      </nav>

// Phrases that usually mean "exam", "homework" or "deadline"
const TODO_RX = /\b(klausur|prüfung|prüfungsrelevant|hausaufgabe|abgabe|frist|deadline|bis nächste[n]? woche|lesen sie|kapitel \w+|übungsblatt|wichtig|exam|test|quiz|homework|assignment|due|read chapter|chapter \w+|next week|important|will be on)\b/i;
const MODEL = "claude-opus-5-5";
const PRICE_IN = 4 / 1e6, PRICE_OUT = 20 / 1e6; // USD per token for Claude Opus 5.5

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const KEY = "mitschrift.sessions.v1";
const pref = { get(k) { try { return localStorage.getItem(k) } catch { return null } }, set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v) } catch {} } };

let sessions; try { sessions = JSON.parse(localStorage.getItem(KEY)) || [] } catch { sessions = [] }
let cur = null, lang = "de-DE", tab = "doc";
let rec = null, want = false, startedAt = 0, tick = null, wakeLock = null, level = 0;
let editing = false, pendingRender = false, gen = null, editingMd = false;
const t = k => T[ui][k];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(sessions)) } catch { toast("Speichern fehlgeschlagen – exportiere die Vorlesung. / Couldn't save – export the lecture.", true) } };

const fmt = ms => { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ":" : "") + String(m).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0") };
const now = () => cur.elapsed + (want ? Date.now() - startedAt : 0);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const btn = (cls, text, fn) => { const b = el("button", cls, text); b.type = "button"; b.onclick = fn; return b };
const icon = id => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); const u = document.createElementNS("http://www.w3.org/2000/svg", "use"); u.setAttribute("href", "#" + id); s.append(u); return s };
const wordCount = s => s.lines.reduce((n, l) => n + l.text.split(/\s+/).filter(Boolean).length, 0);
const ended = s => /[.!?…:;]$/.test(s) ? s : s + ".";

function toast(msg, err, action) {
  const x = $("toast"); $("toastMsg").textContent = msg; x.classList.toggle("err", !!err); x.classList.add("show");
  const a = $("toastAct"); a.hidden = !action;
  if (action) { a.textContent = action.label; a.onclick = () => { action.run(); x.classList.remove("show") } }
  clearTimeout(toast.h); toast.h = setTimeout(() => x.classList.remove("show"), action ? 7000 : err ? 5500 : 2600);
}

/* ---------- sessions ---------- */
function newSession() {
  if (want) return toast(t("stopFirst"));
  if (wQueue) return toast(t("waitConvert"));
  const d = new Date();
  cur = { id: String(Date.now()), title: `${t("untitled")} · ${d.toLocaleDateString(ui)}`, lang, created: d.toISOString(), elapsed: 0, lines: [] };
  sessions.unshift(cur); save(); closeDrawer(); setTab("doc"); renderAll(); $("title").select();
}
function pick(id) {
  if (want) return toast(t("stopFirst"));
  if (wQueue) return toast(t("waitConvert"));
  cur = sessions.find(s => s.id === id) || sessions[0]; setLang(cur.lang || "de-DE"); editingMd = false; closeDrawer(); renderAll();
}
function removeSession(id) {
  sessions = sessions.filter(s => s.id !== id); save(); toast(t("deleted"));
  if (!sessions.length) return newSession();
  if (cur.id === id) cur = sessions[0];
  renderAll();
}

/* ---------- rendering ---------- */
function applyUI() {
  document.documentElement.lang = ui;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll("[data-ui]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.ui === ui)));

  $("recBtn").setAttribute("aria-label", want ? t("stop") : t("rec"));
  stateUpdate(); engineUI();
  $("keyP").textContent = t("keyP"); $("costP").textContent = t("costP"); $("glossBox").placeholder = t("glossPh");
  keyStatus(); buildRules();
  if (cur) renderAll();
}
function renderAll() {
  $("title").value = cur.title;
  $("timer").textContent = fmt(now());
  renderDoc();
  if (tab === "notes") renderNotes();
}
function renderMeta() {
  const d = new Date(cur.created).toLocaleDateString(ui, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const w = wordCount(cur);
  $("meta").replaceChildren(el("span", null, d), el("span", null, fmt(cur.elapsed)), el("span", null, `${w.toLocaleString(ui)} ${t("words")}`), el("span", null, cur.lang === "de-DE" ? "Deutsch" : "English"));
  $("cWords").textContent = w ? w.toLocaleString(ui) : "";
  const m = cur.lines.filter(l => l.star).length; $("cMarks").textContent = m || "";
}
function renderLib() {
  const root = $("lib"); root.replaceChildren();
  sessions.forEach(s => {
    const item = el("div", "lib-item" + (s.id === cur.id ? " cur" : ""));
    const open = el("button", "open"); open.type = "button"; open.onclick = () => pick(s.id);
    open.append(el("b", null, s.title), el("small", null, `${new Date(s.created).toLocaleDateString(ui, { day: "numeric", month: "short" })} · ${wordCount(s).toLocaleString(ui)} ${t("words")}`));
    const del = el("button", "icon-btn del"); del.type = "button"; del.append(icon("i-trash")); del.setAttribute("aria-label", t("del") + ": " + s.title);
    del.onclick = () => {
      if (busy() && s.id === cur.id) return toast(want ? t("stopFirst") : t("waitConvert"));
      item.querySelector(".confirm")?.remove();
      const c = el("div", "confirm"); c.append(el("span", null, t("delQ")), btn("btn danger", t("del"), () => removeSession(s.id)), btn("btn", t("keep"), () => c.remove()));
      item.append(c); c.querySelector(".danger").focus();
    };
    item.append(open, del); root.append(item);
  });
}
// The transcript reads like a document: sentences flow into paragraphs, own notes sit in between
function renderDoc() {
  if (editing) { pendingRender = true; return }
  pendingRender = false;
  const root = $("doc"); root.replaceChildren();
  let p = null, count = 0, lastT = -1e9;
  cur.lines.forEach(l => {
    if (l.own) { const n = el("div", "note"); n.append(el("span", "label", t("noteLabel")), lineSpan(l)); root.append(n); p = null; return }
    if (!p || count >= 6 || l.t - lastT > 15000) { p = el("p"); root.append(p); count = 0 }
    if (count) p.append(" ");
    p.append(lineSpan(l)); count++; lastT = l.t;
  });
  $("empty").hidden = cur.lines.length > 0;
  renderMeta(); renderLib();
}
function lineSpan(l) {
  const s = el("span", "ln" + (l.star ? " hl" : ""), l.own ? l.text : ended(l.text));
  s.tabIndex = 0;
  const toggle = () => { l.star = !l.star; save(); s.classList.toggle("hl", l.star); renderMeta() };
  // One tap highlights, two quick taps edit: wait briefly to tell them apart
  s.onclick = () => {
    if (s.isContentEditable) return;
    if (s._tap) { clearTimeout(s._tap); s._tap = 0; editSpan(s, l); return }
    s._tap = setTimeout(() => { s._tap = 0; toggle() }, 250);
  };
  s.onkeydown = e => { if (s.isContentEditable) return; if (e.key === "Enter") { e.preventDefault(); toggle() } if (e.key === "F2" || e.key === "e") { e.preventDefault(); editSpan(s, l) } };

}
function editSpan(s, l) {
  editing = true;

  const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
  let done = false;
  const finish = keep => {
    if (done) return; done = true; editing = false;
    s.contentEditable = "false";
    const v = s.textContent.replace(/\s+/g, " ").trim();
    if (keep && !v) { cur.lines.splice(cur.lines.indexOf(l), 1); save(); toast(t("lineDel")) }
    else if (keep && v !== l.text) { const old = l.text; l.text = v; save(); learnFrom(old, v, l) }
    renderDoc();
  };
  s.onkeydown = e => { e.stopPropagation(); if (e.key === "Enter") { e.preventDefault(); finish(true) } else if (e.key === "Escape") { e.preventDefault(); finish(false) } };
  s.onblur = () => finish(true);
}
function addLine(text, own) {
  text = text.replace(/\s+/g, " ").trim(); if (!text) return;
  if (!own) {
    text = fixText(text)[0];

let glossText = pref.get("mitschrift.glossary") || "";

    const [right, rest = ""] = line.split(/\s*=\s*/);

  }).filter(g => g.right);
}

  rules = terms.flatMap(g => g.variants.map(v => {

    return [new RegExp(`(?<![\\p{L}\\p{N}])${body}(?![\\p{L}\\p{N}])`, "giu"), g.right];

  return [s, n];
}

    if (from === to.toLowerCase() && !/\p{Lu}/u.test(to.slice(1))) continue;

    { label: t("undo"), run: () => { setGloss(beforeGloss); cur.lines = JSON.parse(beforeLines); save(); renderDoc(); toast(t("undone")) } });

    if (r === "bad") { keyStatus("bad"); return toast(t("err401"), true) }
    if (r === "ok") pref.set("mitschrift.keyok", "1");
    keyStatus(); toast(t("keySaved")); if (tab === "notes") renderNotes();
  } catch { keyStatus(); toast(t("errNet"), true) }
};
$("removeKey").onclick = () => { pref.set("mitschrift.apikey", null); pref.set("mitschrift.keyok", null); $("apiKey").value = ""; keyStatus(); toast(t("keyRemoved")); if (tab === "notes") renderNotes() };
function engineUI() {
  const e = engine();
  document.querySelectorAll("[data-engine]").forEach(b => { b.setAttribute("aria-pressed", String(b.dataset.engine === e)); b.disabled = want });
  $("engP").textContent = e === "whisper" ? t("engPWhisper") : t("engPBrowser");
  $("modelRow").hidden = e !== "whisper";
  $("modelStatus").hidden = e !== "whisper";
  $("engPill").textContent = e === "whisper" ? "Whisper" : "Browser";
  $("modelSel").value = activeModel(); $("modelSel").disabled = want;
  if (!$("modelStatus").textContent) $("modelStatus").textContent = t("modelIdle");
}
document.querySelectorAll("[data-engine]").forEach(b => b.onclick = () => { pref.set("mitschrift.engine", b.dataset.engine); engineUI() });
$("modelSel").onchange = () => { pref.set("mitschrift.model", $("modelSel").value); wReady = false; wLoadErr = false; $("modelStatus").textContent = t("modelIdle") };
$("loadModel").onclick = () => { wLoadErr = false; loadModel() };
$("glossBox").value = glossText;
$("glossBox").oninput = () => { glossText = $("glossBox").value; pref.set("mitschrift.glossary", glossText); buildRules() };
$("learnBox").checked = pref.get("mitschrift.learn") !== "0";
$("learnBox").onchange = () => pref.set("mitschrift.learn", $("learnBox").checked ? "1" : "0");
$("glossApply").onclick = () => { const n = fixLecture(); save(); renderDoc(); toast(t("glossDone")(n)) };
window.addEventListener("beforeunload", e => { if (want) { e.preventDefault(); e.returnValue = "" } });

if (sessions.length) { cur = sessions[0]; lang = cur.lang || "de-DE" }
applyUI();
if (!cur) newSession();
setLang(cur.lang || lang);
renderAll(); animate();
if (!SR) toast(t("noSR"), true);
</script>
</body>
</html>
